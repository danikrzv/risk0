# Lets the plan's root-level command work as written:
#   uv run --project services/risk pytest -m "not live" -v
# Runs inside services/risk use services/risk/pyproject.toml instead.
[pytest]
testpaths = services/risk/tests
pythonpath = services/risk
markers =
    live: opt-in smoke tests against public Morpho data and the configured Ethereum RPC (RISK0_DATA_MODE=live and ETHEREUM_RPC_URL)
