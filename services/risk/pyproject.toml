[project]
name = "risk0-risk"
version = "0.1.0"
description = "Risk0 DeFi risk service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4,<4.15",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "starlette>=0.40,<1",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
